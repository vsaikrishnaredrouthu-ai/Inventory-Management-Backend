# Run the API in Docker, connected to your Supabase database.
#   1. cp .env.example .env   (then fill in DATABASE_URL and JWT_SECRET)
#   2. docker compose up --build -d
#   3. docker compose run --rm api npm run db:setup     (first time only: creates the tables)
#      docker compose run --rm api npm run db:demo      (optional: adds demo users and sample data)
services:
  api:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  uploads:
